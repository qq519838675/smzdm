name: zdm_crawler

on:
  # GitHub Actions 的 cron 使用 UTC 时间
  # 北京时间 = UTC + 8
  #
  # 下面配置表示：
  # 北京时间 08:00-22:00 之间运行
  # 避开整点(:00)高峰，GitHub 在整点丢弃 schedule 触发的概率很高，
  # 所以改成每小时的 :17 和 :47 各触发一次(即每 30 分钟一次)，命中率更高
  schedule:
    # UTC 每小时 :17 触发 = 北京时间 08:17-22:17
    - cron: "17 0-14 * * *"
    # UTC 每小时 :47 触发 = 北京时间 08:47-22:47
    - cron: "47 0-14 * * *"

  # 保留手动触发入口
  # 手动运行不受上面定时范围限制
  workflow_dispatch:
    inputs:
      # 手动触发时，选择 true 可以强制生成提交记录
      should_commit:
        description: '立即生成提交记录'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
    # 安装Chrome和 ChromeDriver
    - name: Setup Chrome
      uses: browser-actions/setup-chrome@v2
      with:
        chrome-version: 145
        chromedriver-version: 145
        install-chromedriver: true
    - name: Update PATH
      run: |
        sudo ln -sf /opt/hostedtoolcache/setup-chrome/chromium/stable/x64/chrome /usr/bin/google-chrome
    # 将上次运行的缓存文件覆盖到本地
    - name: database cache restore
      uses: actions/cache@v4
      with:
        path: database_old.db
        # 每次运行都是唯一的key,避免缓存过期 (缓存总上限10GB, LRU过期策略)
        key: ${{ runner.os }}-database_old-${{ github.run_number }}
        # 兜底机制: 匹配符合这个前缀的最新缓存
        restore-keys: ${{ runner.os }}-database_old-
    - name: database cache copy
      id: db_copy
      run: |
        if [ -f database.db ]; then
          LAST_COUNT=$(sqlite3 database.db "SELECT COUNT(*) FROM ZDM;")
        else
          LAST_COUNT=0
        fi
        echo "last_count=$LAST_COUNT" >> $GITHUB_OUTPUT
        if [ -f database_old.db ]; then
          cp database_old.db database.db
        fi
    # 打包项目
    - name: Build with Maven
      run: |
        mvn package
        cp ./target/zdm-0.0.1.jar ./zdm.jar

    # ===== 新增: 判断当前是否在允许推送的时段内 =====
    # cron 只负责“唤醒”, 真正是否执行主逻辑由这一步决定,
    # 这样即使 GitHub 调度出现漂移(凌晨也被唤醒), 也不会真的抓取推送。
    - name: check push window
      id: window
      run: |
        # 取北京时间的小时 (0-23)
        HOUR=$(TZ=Asia/Shanghai date +%H)
        echo "Beijing hour: $HOUR"
        # 允许推送的时段: 北京时间 08:00-22:59
        # 想改时段就改下面这两个数字 (含起始点 8, 含结束点 22)
        if [ "$HOUR" -ge 8 ] && [ "$HOUR" -le 22 ]; then
          echo "in_window=true" >> $GITHUB_OUTPUT
        else
          echo "in_window=false" >> $GITHUB_OUTPUT
        fi

    - name: main logic
      # 只有在允许时段内才执行主逻辑; 不在时段内则整步跳过
      if: steps.window.outputs.in_window == 'true'
      env:
        #爬取数据时的最大翻页数量
        maxPageSize: 10
        # 白名单关键词搜索页数. 白名单不为空时生效; 热门排序老内容较多, 多取几页后再按发布时间过滤
        searchPageSize: 5
        # 只推送最近N天发布的优惠信息, 填0代表不限制发布日期
        maxArticleAgeDays: 3
        # 点值的数量>minVoted,才会被推送,填0为都推送
        minVoted: 8
        # 评论的数量>minComments,才会被推送,填0为都推送
        minComments: 2
        # 优惠信息数量>MIN_PUSH_SIZE就会发邮件,否则积累到下一次触发任务再决定是否推送. 不建议填太小的数字,避免邮件太多了
        MIN_PUSH_SIZE: 5
        # 邮箱的smtp服务器地址(示例给出的是qq邮箱的配置,非qq邮箱需要进行修改)
        emailHost: smtp.qq.com
        # 邮箱smtp服务端口
        emailPort: 465
        # 接收优惠信息的邮箱 为空代表不进行邮箱推送
        emailAccount: ${{secrets.emailAccount}}
        # 接收优惠信息的邮箱的授权码 为空代表不进行邮箱推送
        emailPassword: ${{secrets.emailPassword}}
        # WxPusher极简推送模式的spt 为空代表不进行Wx推送
        spt: ${{secrets.spt}}
        # true:下载阶段打印出详细信息(待推送的优惠信息列表,过滤时使用的黑白词),因文本量比较大,在调通项目后可以改为false
        detail: false
      run: java -jar zdm.jar
    # 检查数据库中新增行数是否超过提交阈值
    - name: check database changes
      id: commit_check
      env:
        # 提交阈值,0代表每次运行都会生成commit记录
        COMMIT_THRESHOLD: 50
      run: |
        LAST_COUNT=${{ steps.db_copy.outputs.last_count }}
        CURRENT_COUNT=$(sqlite3 database.db "SELECT COUNT(*) FROM ZDM;")
        NEW_ROWS=$((CURRENT_COUNT - LAST_COUNT))
        echo "Last count: $LAST_COUNT , Current count: $CURRENT_COUNT , New rows: $NEW_ROWS"
        if [ $NEW_ROWS -ge $COMMIT_THRESHOLD ]; then
          echo "should_commit=true" >> $GITHUB_OUTPUT
        fi
        cp database.db database_old.db
    # 保存已推送和暂未推送的优惠信息
    - name: git add files
      if: steps.commit_check.outputs.should_commit == 'true' || inputs.should_commit == 'true'
      run: |
        git add database.db
    - name: commit & push
      if: steps.commit_check.outputs.should_commit == 'true' || inputs.should_commit == 'true'
      uses: actions-go/push@master
      with:
        author-email: 'actions@github.com'
        author-name: 'GitHub Actions'
        commit-message: 'update articles'
        token: ${{secrets.GIT_TOKEN}}
